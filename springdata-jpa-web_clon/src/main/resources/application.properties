spring.application.name=demo

server.port=8081
#server.error.whitelabel.enabled=false
spring.web.error.whitelabel.enabled=false


# DB Connection(Oracle)
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:orcl
spring.datasource.username=scott
spring.datasource.password=tiger

# DB Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10


# JPA 설정
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
##spring.jpa.hibernate.ddl-auto=update	    #[old.error] JPA가 테이블을 자동으로 생성 및 업데이트하도로 설정(create, update)
spring.jpa.hibernate.hbm2ddl.auto=update	#[new] JPA가 테이블을 자동으로 생성 및 업데이트하도로 설정(create, update, validate)
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace

# thymeleaf auto refresh    #[ref] 타임리프(서버사이드에서 동적 html 생성 지원)
#spring.thymeleaf.cache=false
#[ref] 타임리프 html 변경 -> 자동 재시작
spring.devtools.livereload.enabled=true

# logging level
#logging.level.org.springframework=DEBUG

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
